<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS Manhunt - Real-Time Tactical Tag</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 100%; width: 100%; z-index: 1; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .seeker-pulse::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%; border: 3px solid #ef4444; animation: pulse-ring 1.5s infinite;
    }
    .hider-pulse::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%; border: 3px solid #3b82f6; animation: pulse-ring 2s infinite;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased select-none overflow-hidden bg-slate-950">

  <div id="app" class="h-full flex flex-col relative overflow-hidden">
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-20 shadow-md">
      <div class="flex items-center space-x-2">
        <div class="bg-amber-500 text-slate-950 font-black px-2 py-0.5 rounded text-xs tracking-wider uppercase">MANHUNT</div>
        <div id="room-code-display" class="text-xs text-slate-400 font-mono hidden">ROOM: <span id="current-room-id" class="text-amber-400 font-bold">---</span></div>
      </div>
      <div id="timer-display" class="hidden flex items-center bg-slate-800 px-3 py-1 rounded-full border border-slate-700 space-x-2">
        <i class="fa-solid fa-stopwatch text-amber-400 text-xs"></i>
        <span id="time-left" class="font-mono text-xs font-bold text-slate-200">00:00</span>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-open-rules" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg border border-slate-700 transition"><i class="fa-solid fa-book text-sm"></i></button>
        <button id="btn-open-roster" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg border border-slate-700 transition relative"><i class="fa-solid fa-users text-sm"></i><span id="roster-count" class="absolute -top-1 -right-1 bg-amber-500 text-slate-950 text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span></button>
      </div>
    </header>

    <div id="notification-banner" class="hidden bg-amber-500 text-slate-950 px-4 py-2 text-center text-xs font-bold z-30 flex items-center justify-between shadow-lg">
      <span id="notification-text" class="truncate flex-1">Alert message</span>
      <button id="btn-dismiss-banner" class="ml-2 text-slate-950"><i class="fa-solid fa-xmark text-sm"></i></button>
    </div>

    <main class="flex-1 relative overflow-hidden flex flex-col">
      <div id="map-container" class="absolute
