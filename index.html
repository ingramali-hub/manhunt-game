<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS Manhunt - Real-Time Tactical Tag</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 100%; width: 100%; z-index: 1; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .seeker-pulse::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%; border: 3px solid #ef4444; animation: pulse-ring 1.5s infinite;
    }
    .hider-pulse::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%; border: 3px solid #3b82f6; animation: pulse-ring 2s infinite;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased select-none overflow-hidden bg-slate-950">

  <div id="app" class="h-full flex flex-col relative overflow-hidden">
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-20 shadow-md">
      <div class="flex items-center space-x-2">
        <div class="bg-amber-500 text-slate-950 font-black px-2 py-0.5 rounded text-xs tracking-wider uppercase">MANHUNT</div>
        <div id="room-code-display" class="text-xs text-slate-400 font-mono hidden">ROOM: <span id="current-room-id" class="text-amber-400 font-bold">---</span></div>
      </div>
      <div id="timer-display" class="hidden flex items-center bg-slate-800 px-3 py-1 rounded-full border border-slate-700 space-x-2">
        <i class="fa-solid fa-stopwatch text-amber-400 text-xs"></i>
        <span id="time-left" class="font-mono text-xs font-bold text-slate-200">00:00</span>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-open-rules" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg border border-slate-700 transition"><i class="fa-solid fa-book text-sm"></i></button>
        <button id="btn-open-roster" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg border border-slate-700 transition relative"><i class="fa-solid fa-users text-sm"></i><span id="roster-count" class="absolute -top-1 -right-1 bg-amber-500 text-slate-950 text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span></button>
      </div>
    </header>

    <div id="notification-banner" class="hidden bg-amber-500 text-slate-950 px-4 py-2 text-center text-xs font-bold z-30 flex items-center justify-between shadow-lg">
      <span id="notification-text" class="truncate flex-1">Alert message</span>
      <button id="btn-dismiss-banner" class="ml-2 text-slate-950"><i class="fa-solid fa-xmark text-sm"></i></button>
    </div>

    <main class="flex-1 relative overflow-hidden flex flex-col">
      <div id="map-container" class="absolute inset-0 w-full h-full">
        <div id="map"></div>
        <div id="my-role-badge" class="hidden absolute top-3 left-3 z-[10] bg-slate-900/95 px-3 py-1.5 rounded-lg border border-slate-700 shadow-lg flex items-center space-x-2">
          <span id="role-indicator-dot" class="w-3 h-3 rounded-full bg-slate-400"></span>
          <span id="role-text" class="text-xs font-bold uppercase tracking-wider text-slate-200">SPECTATOR</span>
          <span id="oob-badge" class="hidden text-[10px] bg-red-600 text-white font-black px-1.5 py-0.5 rounded animate-pulse">EXPOSED (OOB)</span>
        </div>
        <div id="tag-action-container" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-[10]">
          <button id="btn-tag-hiders" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-full shadow-2xl flex items-center space-x-2 transition"><i class="fa-solid fa-crosshairs text-lg"></i><span>TAG NEARBY HIDER</span></button>
        </div>
      </div>

      <!-- LOBBY SCREEN OVERLAY -->
      <div id="screen-lobby" class="absolute inset-0 bg-slate-950 z-40 flex items-center justify-center p-4 overflow-y-auto">
        <div class="max-w-md w-full space-y-6 my-auto">
          <div class="text-center space-y-2">
            <div class="inline-block bg-amber-500 text-slate-950 px-3 py-1 rounded-full text-xs font-black tracking-widest uppercase">GPS MULTIPLAYER</div>
            <h1 class="text-3xl font-black text-white">MANHUNT GPS</h1>
            <p class="text-xs text-slate-400">Real-world hide & seek with live radar</p>
          </div>

          <!-- Entry Card -->
          <div id="lobby-entry-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Player Callsign / Name</label>
              <input type="text" id="player-name-input" placeholder="e.g. Ghost" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 text-sm">
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
              <button type="button" onclick="window.showCreateScreen()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-4 rounded-xl text-sm transition shadow">Create Room</button>
              <button type="button" onclick="window.showJoinScreen()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 px-4 rounded-xl text-sm border border-slate-700 transition">Join Room</button>
            </div>
          </div>

          <!-- Join Form -->
          <div id="join-form-card" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
            <h3 class="text-sm font-bold text-amber-400 uppercase">Join Room</h3>
            <input type="text" id="join-room-code" placeholder="ENTER 4-LETTER CODE" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 font-mono text-center text-lg tracking-widest uppercase focus:outline-none focus:border-amber-500">
            <div class="flex space-x-2">
              <button type="button" onclick="window.showEntryCard()" class="w-1/3 bg-slate-800 text-slate-400 font-bold py-3 rounded-xl text-xs">Back</button>
              <button type="button" onclick="window.joinGameRoom()" class="w-2/3 bg-amber-500 text-slate-950 font-bold py-3 rounded-xl text-xs hover:bg-amber-400">Join Game</button>
            </div>
          </div>

          <!-- Create Form -->
          <div id="create-form-card" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
            <h3 class="text-sm font-bold text-amber-400 uppercase">Configure Match</h3>
            <div class="space-y-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Duration (Minutes)</label>
                <input type="number" id="setting-duration" value="30" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200">
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Tracking Mode</label>
                <select id="setting-mode" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200">
                  <option value="proximity">Proximity Radar (Hides within 100m)</option>
                  <option value="ping">Periodic Ping</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Boundary Radius (Meters)</label>
                <input type="number" id="setting-radius" value="500" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200">
              </div>
            </div>
            <div class="flex space-x-2 pt-2">
              <button type="button" onclick="window.showEntryCard()" class="w-1/3 bg-slate-800 text-slate-400 font-bold py-3 rounded-xl text-xs">Back</button>
              <button type="button" onclick="window.createGameRoom()" class="w-2/3 bg-amber-500 text-slate-950 font-bold py-3 rounded-xl text-xs hover:bg-amber-400">Launch Room</button>
            </div>
          </div>

          <!-- Waiting Lobby -->
          <div id="waiting-lobby-card" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
              <div>
                <span class="text-xs text-slate-400 uppercase font-bold">Room Code</span>
                <div id="lobby-room-code" class="text-2xl font-mono font-black text-amber-400">---</div>
              </div>
              <div id="host-badge" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-2.5 py-1 rounded-full font-bold">Host</div>
            </div>
            <div>
              <span class="text-xs text-slate-400 font-bold uppercase">Players (<span id="lobby-count">0</span>)</span>
              <div id="lobby-players-list" class="space-y-1.5 max-h-40 overflow-y-auto custom-scroll pr-1 mt-2">
